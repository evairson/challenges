<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — NetSphère</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="head">🔐 Administration</div>
    <div class="body">
      <p class="intro">Accès réservé. Protection anti-injection active : toute requête renvoyant
        plusieurs comptes est rejetée.</p>
      <form data-level="3" autocomplete="off">
        <label for="u">Nom d'utilisateur</label>
        <input type="text" name="username" id="u">
        <label for="p">Mot de passe</label>
        <input type="password" name="password" id="p">
        <button type="submit" class="submit">Authentification</button>
      </form>
      <div class="links"><a href="index.html">← Autres espaces</a></div>
      <div class="out"></div>
      <div class="debug"><a data-toggleq>Aide : afficher la requête</a></div>
      <pre class="q" data-q hidden>SELECT * FROM users WHERE password='…' AND username='…'</pre>
      <p class="boot" data-boot>&nbsp;</p>
    </div>
  </div>
  <div class="goals" data-goals></div>
</div>
<script src="engine.js"></script>
</body>
</html>
